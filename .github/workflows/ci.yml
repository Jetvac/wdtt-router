name: CI

on:
  push:
    branches: [main, rewrite-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run typecheck && npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal web)"
      - run: go vet ./...
      - run: go test ./...
      # The chain tunnel end to end: the real service and the agent's rules
      # in network namespaces (needs root; skips where TPROXY is missing).
      - name: Chain tunnel in network namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables iputils-ping
          go test -c -o /tmp/agent.test ./internal/agent
          sudo WDTT_NETNS_TEST=1 /tmp/agent.test -test.run TestNetnsLink -test.v -test.count=1
      - run: CGO_ENABLED=0 go build -o /tmp/wdtt-router ./cmd/wdtt-router
      - run: GOOS=windows go vet ./cmd/wdtt-desktop ./internal/desktop
      - run: GOOS=windows CGO_ENABLED=0 go build -o /tmp/wdtt-router-app.exe ./cmd/wdtt-desktop
      - run: bash -n install.sh
