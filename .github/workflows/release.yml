name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o wdtt-panel ./cmd/wdtt-panel
          tar -czf "wdtt-panel-linux-${GOARCH}.tar.gz" wdtt-panel
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-panel-linux-${{ matrix.arch }}
          path: wdtt-panel-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wdtt-panel-linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh dist/install.sh
          cd dist && sha256sum wdtt-panel-linux-*.tar.gz install.sh > SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/wdtt-panel-linux-*.tar.gz dist/SHA256SUMS dist/install.sh --generate-notes --verify-tag
