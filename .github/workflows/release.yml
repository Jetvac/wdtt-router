name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build archives
        run: |
          set -eu
          mkdir -p out
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/Jetvac/wdtt-router/internal/agent.Version=${GITHUB_REF_NAME}" \
              -o out/wdtt-router ./cmd/wdtt-router
            tar -C out -czf out/wdtt-router-linux-$arch.tar.gz wdtt-router
            rm out/wdtt-router
          done
          cp install.sh out/
          (cd out && sha256sum wdtt-router-linux-*.tar.gz install.sh > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wdtt-router-linux-amd64.tar.gz
            out/wdtt-router-linux-arm64.tar.gz
            out/install.sh
            out/SHA256SUMS
