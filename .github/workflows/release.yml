name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build archives
        run: |
          set -eu
          mkdir -p out
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/Jetvac/wdtt-router/internal/agent.Version=${GITHUB_REF_NAME}" \
              -o out/wdtt-router ./cmd/wdtt-router
            tar -C out -czf out/wdtt-router-linux-$arch.tar.gz wdtt-router
            rm out/wdtt-router
          done
          cp install.sh out/
          (cd out && sha256sum wdtt-router-linux-*.tar.gz install.sh > SHA256SUMS)
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY || secrets.MAIN }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set: refusing to publish an unsigned release"
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.pem" -rawin -in out/SHA256SUMS -out out/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release.pem"
          openssl pkeyutl -verify -pubin -inkey release-signing.pub -rawin -in out/SHA256SUMS -sigfile out/SHA256SUMS.sig
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wdtt-router-linux-amd64.tar.gz
            out/wdtt-router-linux-arm64.tar.gz
            out/install.sh
            out/SHA256SUMS
            out/SHA256SUMS.sig
